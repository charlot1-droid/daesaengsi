<!-- @dsCard height=300 -->
<style>
.cv{position:relative;width:960px;height:300px;background:var(--ground);overflow:hidden}
.cv svg{position:absolute;inset:0}
.ink{fill:var(--ink)} .pn{fill:var(--panel)} .ln{stroke:var(--line);stroke-width:2;fill:var(--panel)} .rose{fill:var(--rose)} .mist{fill:var(--rose-mist);stroke:var(--rose);stroke-width:3}
.name{position:absolute;left:48px;bottom:70px;font:900 120px/.95 'Wanted Sans',Pretendard,sans-serif;letter-spacing:-.04em;color:var(--ink)}
.tag{position:absolute;left:52px;bottom:40px;max-width:420px;font:500 14px/1.4 'Wanted Sans',Pretendard,sans-serif;color:var(--muted)}
</style>
<div class="cv">
<!-- blocks: ink stage slab bleeding off the right edge; three answer rows in panel (r-md 14) with ink number discs; the winning row in rose-mist with a rose disc
     arrangement: the stage screen's own upper reading area — question bar on top, three stacked answers beneath, one chosen
     pattern: the numbered answer rows themselves, because this system speaks in "1·2·3" and one answer becomes the story
     steps: rows 56 tall, gap 12 (s-3), discs r 16, panel radius r-md 14, offsets s-7 48 -->
<svg viewBox="0 0 960 300" aria-hidden="true">
 <rect class="ink" x="760" y="-10" width="220" height="320"/>
 <rect class="ln" x="500" y="28" width="400" height="56" rx="14"/>
 <rect class="ink" x="524" y="50" width="200" height="12" rx="6" opacity=".85"/>
 <rect class="ln" x="500" y="96" width="400" height="56" rx="14"/>
 <circle class="ink" cx="532" cy="124" r="16"/><rect class="ink" x="560" y="119" width="170" height="10" rx="5" opacity=".35"/>
 <rect class="mist" x="500" y="164" width="400" height="56" rx="14"/>
 <circle class="rose" cx="532" cy="192" r="16"/><rect class="ink" x="560" y="187" width="220" height="10" rx="5" opacity=".7"/>
 <rect class="ln" x="500" y="232" width="400" height="56" rx="14"/>
 <circle class="ink" cx="532" cy="260" r="16"/><rect class="ink" x="560" y="255" width="140" height="10" rx="5" opacity=".35"/>
</svg>
<div class="name">대생시</div>
<div class="tag">300명이 1·2·3 중 하나를 골라 함께 쓰는 봄 캠퍼스 미연시.</div>
</div>
